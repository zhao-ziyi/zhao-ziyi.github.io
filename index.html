<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zz1ink</title>
    <link rel="icon" href="asserts/logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 800px;
            width: 90%;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            animation: slideInDown 0.8s ease-out;
        }

        .logo {
            width: 60px;
            height: 60px;
            object-fit: cover;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: scaleIn 0.5s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle 100px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.4), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            border-radius: 15px;
        }

        .link-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle 80px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(102, 126, 234, 0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            border-radius: 15px;
        }

        .link-card:hover::before,
        .link-card:hover::after {
            opacity: 1;
        }

        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .link-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .link-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .link-url {
            font-size: 0.9rem;
            color: #666;
            text-decoration: none;
            display: block;
            transition: color 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .link-url:hover {
            color: #667eea;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px;
            }

            h1 {
                font-size: 2rem;
            }

            .links-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="asserts/logo.png" alt="logo" class="logo">
            <h1>zz1ink</h1>
        </div>

        <div class="links-container" id="linksContainer"></div>
    </div>

    <script>
        const links = [
            { icon: '🌐', title: 'Google', url: 'https://www.google.com' },
            { icon: '📘', title: 'GitHub', url: 'https://github.com' },
            { icon: '📧', title: 'Gmail', url: 'https://mail.google.com' },
            { icon: '🎵', title: 'YouTube', url: 'https://www.youtube.com' }
        ];

        const container = document.getElementById('linksContainer');
        links.forEach((link, index) => {
            const card = document.createElement('div');
            card.className = 'link-card';
            card.style.animationDelay = `${index * 0.1}s`;
            card.innerHTML = `
                <span class="link-icon">${link.icon}</span>
                <div class="link-title">${link.title}</div>
                <a href="${link.url}" class="link-url" target="_blank">${link.url}</a>
            `;

            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });

            card.addEventListener('click', () => {
                window.open(link.url, '_blank');
            });
            container.appendChild(card);
        });

        document.addEventListener('mousemove', (e) => {
            const cursor = document.createElement('div');
            cursor.style.position = 'fixed';
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.style.width = '10px';
            cursor.style.height = '10px';
            cursor.style.borderRadius = '50%';
            cursor.style.background = 'rgba(255, 255, 255, 0.5)';
            cursor.style.pointerEvents = 'none';
            cursor.style.zIndex = '9999';
            cursor.style.transition = 'all 0.3s ease';

            document.body.appendChild(cursor);

            setTimeout(() => {
                cursor.style.opacity = '0';
                cursor.style.transform = 'scale(0)';
                setTimeout(() => {
                    document.body.removeChild(cursor);
                }, 300);
            }, 1000);
        });
    </script>
</body>
</html>
